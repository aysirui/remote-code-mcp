# 文档独立部署，保留 VitePress 的 /docs/ 资源前缀。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 文档 HTML 默认纳入 gzip，额外压缩样式、脚本和可索引的文本资源。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/xml text/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # 规范化文档根路径，同时保留查询参数。
    location = /docs {
        # 使用相对重定向，由浏览器沿用反代对外的 HTTPS 和域名。
        absolute_redirect off;
        return 301 /docs/$is_args$args;
    }

    # VitePress 构建文件直接返回；不存在的文档不回退到官网。
    location ^~ /docs/ {
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;

        # 仅长期缓存 VitePress 生成的带内容哈希资源，页面和 sitemap 可及时更新。
        location ~ "^/docs/assets/.+[.][A-Za-z0-9_-]{8}([.]lean)?[.](css|js|woff2)$" {
            expires 1y;
            try_files $uri =404;
        }
    }

    # 其他路径不属于文档服务。
    location / {
        return 404;
    }
}

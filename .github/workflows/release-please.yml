name: Main CI and Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 主分支检查和发布串行执行；不取消已经开始的发布任务。
concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # 仅在当前 main 提交通过 CI 后准备发布 PR 或发布已合并的版本。
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

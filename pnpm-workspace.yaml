packages:
  - apps/*
  - packages/*

# 使用 Rollup 官方 WASM 实现，避免 Windows 平台构建时加载 .node 原生扩展。
# 此覆盖作用于整个工作区；更新依赖后需重新执行 pnpm install 生成锁文件。
overrides:
  rollup: npm:@rollup/wasm-node@4.68.0

catalog:
  axios: ^1.13.2
  typescript: ^5.9.0
  '@types/node': ^22.0.0
  tsx: ^4.20.0
  jest: ^30.0.0
  ts-jest: ^29.4.0
  '@types/jest': ^30.0.0
  zod: ^3.25.0
  ws: ^8.18.0
  vue: ^3.5.0
  vite: ^7.1.0
  vue-tsc: ^3.1.0
  '@vitejs/plugin-vue': ^6.0.0
  element-plus: ^2.11.0
  pinia: ^3.0.0

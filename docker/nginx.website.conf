# 产品官网是独立的静态站点；未匹配路径不回退到 Console 或 Server。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 仅压缩公开静态文本，支持经反代访问并按客户端压缩能力区分缓存。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/xml text/xml image/svg+xml;

    # 通用响应头不包含运行环境和内部代理信息。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Astro 静态资源按文件查找，未知页面保留 404。
    location / {
        try_files $uri $uri/ =404;
    }

    # 构建产物的带哈希资源可以长期缓存。
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
